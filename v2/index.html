<title>La Butaca</title>
<style>
:root { --paper:#fdf7f2; --ink:#23181c; --muted:#74656b; --line:#eadcd8; --card:#fff; --red:#d7263d; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --paper:#17110f; --ink:#f6ece8; --muted:#b0a09f; --line:#34282a; --card:#211a1b; --red:#ff5a6e; color-scheme:dark; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui, sans-serif; padding:16px; box-sizing:border-box; }
form { background:var(--card); border-radius:22px; border-top:6px solid var(--red); padding:1.75rem 1.5rem; width:min(100%, 22rem); display:grid; gap:.8rem; box-shadow:0 6px 18px rgba(0,0,0,.08); }
h1 { margin:0; font-size:2rem; line-height:1; } h1 span { color:var(--red); }
p { margin:0; color:var(--muted); }
input[type=password] { font:inherit; border:1.5px solid var(--line); border-radius:999px; padding:.6rem 1rem; background:var(--paper); color:var(--ink); }
button { font:600 1rem system-ui, sans-serif; border:0; border-radius:999px; padding:.65rem 1rem; background:var(--ink); color:var(--paper); cursor:pointer; }
label.rem { font-size:.9rem; color:var(--muted); display:flex; gap:.4rem; align-items:center; }
.err { color:var(--red); min-height:1.2em; font-size:.9rem; }
</style></head><body>
