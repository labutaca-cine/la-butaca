<title>La Butaca</title>
<style>
:root { --paper:#fdf7f2; --ink:#23181c; --muted:#74656b; --line:#eadcd8; --card:#fff; --red:#d7263d; color-scheme:light; }
@media (prefers-color-scheme: dark) { :root { --paper:#17110f; --ink:#f6ece8; --muted:#b0a09f; --line:#34282a; --card:#211a1b; --red:#ff5a6e; color-scheme:dark; } }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--paper); color:var(--ink); font:16px/1.5 system-ui, sans-serif; padding:16px; box-sizing:border-box; }
form { background:var(--card); border-radius:22px; border-top:6px solid var(--red); padding:1.75rem 1.5rem; width:min(100%, 22rem); display:grid; gap:.8rem; box-shadow:0 6px 18px rgba(0,0,0,.08); }
h1 { margin:0; font-size:2rem; line-height:1; } h1 span { color:var(--red); }
p { margin:0; color:var(--muted); }
input[type=password] { font:inherit; border:1.5px solid var(--line); border-radius:999px; padding:.6rem 1rem; background:var(--paper); color:var(--ink); }
button { font:600 1rem system-ui, sans-serif; border:0; border-radius:999px; padding:.65rem 1rem; background:var(--ink); color:var(--paper); cursor:pointer; }
label.rem { font-size:.9rem; color:var(--muted); display:flex; gap:.4rem; align-items:center; }
.err { color:var(--red); min-height:1.2em; font-size:.9rem; }

function hex(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
function b64(s) { var b = atob(s), a = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a; }
async function bitsFrom(pw) {
  var k = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: hex(SALT), iterations: ITER, hash: "SHA-256" }, k, 384));
}
async function open(bits) {

  var pt = await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, ct);
  var page = new TextDecoder().decode(pt);
  document.open(); document.write(page); document.close();
}
var saved = null; try { saved = localStorage.getItem("butaca-key-" + SALT); } catch (e) {}
if (saved) open(b64(saved)).catch(function () { try { localStorage.removeItem("butaca-key-" + SALT); } catch (e) {} });
document.getElementById("f").addEventListener("submit", async function (ev) {
  ev.preventDefault();
  var err = document.getElementById("err"); err.textContent = "Проверяю…";
  var remember = document.getElementById("rem").checked;
  try {
    var bits = await bitsFrom(document.getElementById("pw").value);
    var ct = b64(DATA);
    if (String.fromCharCode.apply(null, ct.slice(0, 8)) === "Salted__") ct = ct.slice(16);
    var key = await crypto.subtle.importKey("raw", bits.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    await crypto.subtle.decrypt({ name: "AES-CBC", iv: bits.slice(32, 48) }, key, ct);
    if (remember) {

  } catch (e) { err.textContent = "Неверный пароль. Попробуйте ещё раз."; }
